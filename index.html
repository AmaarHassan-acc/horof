<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الحروف العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F4F8;--ink:#12344D;--card:#fff;--sun:#FFC93C;--ok:#2FA36B;--bad:#E4572E;--line:#BFD9E4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2233;--ink:#EAF4F8;--card:#1A3449;--line:#2C4C66}}
:root[data-theme="dark"]{--bg:#0F2233;--ink:#EAF4F8;--card:#1A3449;--line:#2C4C66}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;font-weight:500;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:'Lalezar','Tajawal',sans-serif;font-size:2.4rem;margin:6px 0 2px;font-weight:400}
.sub{margin:0 0 18px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.let{font-family:'Lalezar','Tajawal',sans-serif;font-size:2.4rem;line-height:1;aspect-ratio:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;cursor:pointer;position:relative}
.let:hover{border-color:var(--sun)}.let.done{border-color:var(--ok)}
.let.done::after{content:"⭐";position:absolute;top:2px;left:4px;font-size:.9rem}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 18px;background:var(--sun);color:#12344D;cursor:pointer;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.big{font-family:'Lalezar','Tajawal',sans-serif;font-size:9rem;line-height:1.1;text-align:center;margin:4px 0}
.q{text-align:center;margin:0 0 16px;font-size:1.2rem;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 6px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .pic{font-size:3.6rem;line-height:1;height:78px;display:flex;align-items:center}
.card .pic img{height:78px;width:78px;object-fit:contain;border-radius:12px}
.card .w{font-size:1.25rem;font-weight:800}
.card.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.card.no{border-color:var(--bad);animation:sh .35s}
@keyframes sh{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
@media (prefers-reduced-motion:reduce){.card.no{animation:none}.card:hover{transform:none}}
.fb{margin-top:18px;display:none;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 16px;border:2px solid var(--line)}
.fb.show{display:flex}.fb img{width:96px;height:96px;object-fit:contain;border-radius:14px}
.fb b{font-size:1.3rem;display:block}.fb .btn{margin-top:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 12px;cursor:pointer}
.tab.on{background:var(--sun);color:#12344D;border-color:var(--sun)}.tab.ok::after{content:" ✓"}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{font-family:'Lalezar','Tajawal',sans-serif;font-size:4rem;line-height:1.3;background:var(--card);border:3px solid var(--line);border-radius:22px;color:var(--ink);cursor:pointer}
.opt.ok,.cell.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.no,.cell.no{border-color:var(--bad);animation:sh .35s}
.find{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{font-family:'Lalezar','Tajawal',sans-serif;font-size:2.8rem;aspect-ratio:1;background:var(--card);border:3px solid var(--line);border-radius:18px;color:var(--ink);cursor:pointer}
.pic1{text-align:center;font-size:6rem;line-height:1.2}.pic1 img{height:130px;width:130px;object-fit:contain;border-radius:16px}.pic1 small{display:block;font:800 1.4rem 'Tajawal',sans-serif}
.say{display:block;margin:0 auto 16px;font-size:1.3rem}
.link{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:56px}.col{display:flex;flex-direction:column;gap:14px}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#sv line{stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.opt.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 30%,var(--card))}.col .opt{font-size:3rem}
.menu{display:grid;gap:14px}.mcard{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:26px;padding:22px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard span{font-size:3.4rem}.mcard b{font-size:1.5rem}.mcard:hover{border-color:var(--sun)}
.dz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dcol{display:flex;flex-direction:column;gap:8px}
.dcol .card{cursor:default;padding:10px 4px}.dcol .card:hover{transform:none}
.slot{aspect-ratio:1;border:3px dashed var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;font:3.6rem/1 'Lalezar','Tajawal',sans-serif}
.slot.hot{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 30%,var(--card))}.slot.ok{border:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;padding:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;min-height:96px}
.tile{font:3.4rem/1.3 'Lalezar','Tajawal',sans-serif;background:var(--sun);color:#12344D;border-radius:18px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;z-index:1}
.tile.drag{z-index:10;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.3)}.tile.back{transition:transform .25s}
@media(max-width:420px){.big{font-size:7rem}.card .w{font-size:1.05rem}.card .pic{font-size:3rem}}
</style></head><body><main>
<section id="menu"><h1>تعلّم الحروف 🌟</h1><p class="sub">ماذا تريد أن تلعب؟</p><div class="menu">
 <button class="mcard" id="m1"><span>🔤</span><b>تعلّم حرفاً</b><small>4 ألعاب لكل حرف</small></button>
 <button class="mcard" id="m2"><span>✋</span><b>لعبة السحب</b><small>اسحب الحرف إلى صورته</small></button></div></section>
<section id="home" hidden><button class="btn ghost" id="hb">رجوع</button><h1>اختر حرفاً</h1><p class="sub" id="prog"></p><div class="grid" id="grid"></div></section>
<section id="play" hidden>
 <div class="bar"><button class="btn ghost" id="back">رجوع</button><span id="stars"></span></div>
 <div class="tabs" id="tabs"></div><div class="big" id="big"></div><p class="q" id="q"></p><div id="stage"></div>
 <div class="fb" id="fb"><img id="fbimg" alt=""><div><b id="fbt"></b><button class="btn" id="next" hidden></button></div></div>
</section>
<section id="drag" hidden>
 <div class="bar"><button class="btn ghost" id="db">رجوع</button><span id="ds"></span></div>
 <p class="q">اسحب كل حرف إلى صورته</p><div class="dz" id="dz"></div><div class="tray" id="tray"></div>
 <div class="fb" id="dfb"><img id="dimg" alt=""><div><b id="dt"></b><button class="btn" id="dnext" hidden>جولة جديدة</button></div></div>
</section></main>

const L=[["أ","أرنب","🐰"],["ب","بقرة","🐄",IMG.cow],["ت","تفاحة","🍎"],["ث","ثعلب","🦊"],["ج","جمل","🐪"],["ح","حصان","🐴"],["خ","خروف","🐑"],["د","دجاجة","🐔"],["ذ","ذرة","🌽"],["ر","ريشة","🪶"],["ز","زرافة","🦒"],["س","سمكة","🐟"],["ش","شمس","☀️"],["ص","صاروخ","🚀"],["ض","ضفدع","🐸"],["ط","طائرة","✈️"],["ظ","ظرف","✉️"],["ع","عنب","🍇"],["غ","غيمة","☁️"],["ف","فيل","🐘"],["ق","قمر","🌙"],["ك","كرة","⚽"],["ل","ليمون","🍋"],["م","موز","🍌"],["ن","نحلة","🐝"],["ه","هدية","🎁"],["و","وردة","🌹"],["ي","يد","✋"]];
const $=id=>document.getElementById(id);
const show=id=>['menu','home','play','drag'].forEach(s=>$(s).hidden=s!==id);
const GN=["اختر البطاقة","أي حرف؟","ابحث عن الحرف","استمع واختر"];
const done=L.map(()=>new Set());let cur=0,g=0,wrong=0;
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const oth=(n)=>shuf(L.map((_,k)=>k).filter(k=>k!==cur)).slice(0,n);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function stars(){const n=done.filter(s=>s.size===4).length;$('stars').textContent='⭐'.repeat(n)}
function home(){show('home');$('grid').innerHTML='';
 L.forEach((l,i)=>{const b=document.createElement('button');b.className='let'+(done[i].size===4?' done':'');b.textContent=l[0];b.setAttribute('aria-label','الحرف '+l[0]);b.onclick=()=>open(i,0);$('grid').append(b)});
 $('prog').textContent='اختر حرفاً — 4 ألعاب لكل حرف — أنجزت '+done.filter(s=>s.size===4).length+' من '+L.length}
const pic=l=>l[3]?'<img src="'+l[3]+'" alt="">':l[2];
function open(i,k){cur=i;g=k;wrong=0;show('play');$('fb').classList.remove('show');$('next').hidden=true;stars();
 $('big').textContent=L[i][0];
 $('tabs').innerHTML='';GN.forEach((n,x)=>{const b=document.createElement('button');b.className='tab'+(x===g?' on':'')+(done[i].has(x)?' ok':'');b.textContent=n;b.onclick=()=>open(i,x);$('tabs').append(b)});
 const S=$('stage');S.innerHTML='';[game1,game2,game3,game4][g](S)}
function fb(img,t){$('fbimg').src=img;$('fbt').textContent=t;$('fb').classList.add('show')}
function bad(b){b.classList.add('no');b.disabled=true;wrong++;fb(wrong%2?IMG.grumpy:IMG.panda,'ليست هذه، حاول مرة أخرى')}
function win(msg){done[cur].add(g);stars();document.querySelectorAll('#stage button').forEach(c=>c.disabled=true);
 document.querySelectorAll('.tab')[g].classList.add('ok');
 fb(IMG.happy,msg);const n=$('next');n.hidden=false;n.textContent=g<3?'اللعبة التالية':'الحرف التالي';
 n.onclick=()=>g<3?open(cur,g+1):open((cur+1)%L.length,0)}
function game1(S){$('q').textContent='أي بطاقة تبدأ بهذا الحرف؟';S.className='cards';
 shuf([cur,...oth(2)]).forEach(k=>{const l=L[k],b=document.createElement('button');b.className='card';
  b.innerHTML='<span class="pic">'+pic(l)+'</span><span class="w">'+l[1]+'</span>';
  b.onclick=()=>{say(l[1]);if(k===cur){b.classList.add('ok');win('أحسنت! '+L[cur][1]+' تبدأ بحرف '+L[cur][0])}else bad(b)};S.append(b)});say(L[cur][0])}
function game2(S){const l=L[cur];$('big').textContent='';$('q').textContent='بأي حرف تبدأ هذه الكلمة؟';S.className='';
 S.innerHTML='<div class="pic1">'+pic(l)+'<small>'+l[1]+'</small></div><div class="opts" id="o" style="margin-top:14px"></div>';
 shuf([cur,...oth(2)]).forEach(k=>{const b=document.createElement('button');b.className='opt';b.textContent=L[k][0];
  b.onclick=()=>k===cur?(b.classList.add('ok'),win('صحيح! '+l[1]+' تبدأ بحرف '+l[0])):bad(b);$('o').append(b)});say(l[1])}
function game3(S){$('q').textContent='اضغط على كل حرف '+L[cur][0];S.className='';let f=0;
 S.innerHTML='<div class="find" id="o"></div>';
 shuf([cur,cur,cur,cur,...oth(8)]).forEach(k=>{const b=document.createElement('button');b.className='cell';b.textContent=L[k][0];
  b.onclick=()=>{if(k===cur){b.classList.add('ok');b.disabled=true;if(++f===4)win('رائع! وجدت الحروف الأربعة')}else bad(b)};$('o').append(b)})}
function game4(S){$('big').textContent='';$('q').textContent='استمع ثم اختر الحرف الصحيح';S.className='';
 S.innerHTML='<button class="btn say" id="sp">🔊 اسمع</button><div class="opts" id="o"></div>';
 $('sp').onclick=()=>say(L[cur][0]);
 shuf([cur,...oth(2)]).forEach(k=>{const b=document.createElement('button');b.className='opt';b.textContent=L[k][0];
  b.onclick=()=>k===cur?(b.classList.add('ok'),win('أحسنت! هذا حرف '+L[cur][0])):bad(b);$('o').append(b)});say(L[cur][0])}
$('back').onclick=home;home();show('menu');

let dn=0,ds=0,dw=0;
const slotAt=e=>document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('slot'));
function dfb(img,m){$('dimg').src=img;$('dt').textContent=m;$('dfb').classList.add('show')}
function back(t){t.classList.add('back');t.style.transform=''}
function tile(t){
 t.onpointerdown=e=>{t.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY;t.classList.remove('back');t.classList.add('drag');say(t.textContent);
  t.onpointermove=v=>{t.style.transform='translate('+(v.clientX-sx)+'px,'+(v.clientY-sy)+'px)';
   document.querySelectorAll('.slot.hot').forEach(x=>x.classList.remove('hot'));const s=slotAt(v);if(s&&!s.classList.contains('ok'))s.classList.add('hot')};
  t.onpointercancel=()=>{t.onpointermove=t.onpointerup=null;t.classList.remove('drag');back(t)};
  t.onpointerup=v=>{t.onpointermove=t.onpointerup=null;t.classList.remove('drag');
   document.querySelectorAll('.slot.hot').forEach(x=>x.classList.remove('hot'));const s=slotAt(v);
   if(s&&!s.classList.contains('ok')){
    if(s.dataset.k===t.dataset.k){s.textContent=t.textContent;s.classList.add('ok');t.remove();say(L[s.dataset.k][1]);$('dfb').classList.remove('show');
     if(++dn===3){ds++;$('ds').textContent='⭐'.repeat(ds);dfb(IMG.happy,'أحسنت! أكملت الجولة');$('dnext').hidden=false}}
    else{back(t);dw++;dfb(dw%2?IMG.grumpy:IMG.panda,'ليس هنا، جرّب مكاناً آخر')}
   }else back(t)}}}

 const ks=shuf(L.map((_,k)=>k)).slice(0,3);
 ks.forEach(k=>{const c=document.createElement('div');c.className='dcol';

 shuf(ks).forEach(k=>{const e=document.createElement('div');e.className='tile';e.textContent=L[k][0];e.dataset.k=k;tile(e);$('tray').append(e)})}
